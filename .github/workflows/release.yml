name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Check version consistency
        run: scripts/check-version-consistency.sh

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Run tests
        run: go test ./...

      - name: Build Go binaries
        run: ./scripts/build.sh

      - name: Upload Go binaries
        uses: actions/upload-artifact@v7
        with:
          name: go-binaries
          path: dist/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Build Go binary for Android
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o android/app/src/main/jniLibs/arm64-v8a/libpocketcluster.so ./cmd/agent

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || { echo "ANDROID_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "${ANDROID_KEY_ALIAS}" || { echo "ANDROID_KEY_ALIAS is not configured"; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD}" || { echo "ANDROID_KEY_PASSWORD is not configured"; exit 1; }
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/pocketcluster-release.jks"
          cd android
          chmod +x gradlew
          ANDROID_KEYSTORE_PATH="${RUNNER_TEMP}/pocketcluster-release.jks" ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  release:
    needs: [build-go, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Go binaries
        uses: actions/download-artifact@v8
        with:
          name: go-binaries
          path: dist/

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: apk/

      - name: Rename APK
        run: |
          mv apk/app-release.apk dist/PocketCluster-${{ github.ref_name }}.apk
          sha256sum dist/* > dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/agent-darwin-arm64
            dist/agent-darwin-amd64
            dist/agent-linux-arm64
            dist/agent-linux-amd64
            dist/agent-windows-amd64.exe
            dist/agent-windows-arm64.exe
            dist/agent-android-arm64
            dist/PocketCluster-${{ github.ref_name }}.apk
            dist/SHA256SUMS
